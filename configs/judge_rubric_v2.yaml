# LLM 裁判的评分标准 v2（**对外汇报用**，不进奖励）
#
# ============================ 为什么必须有第二版 ============================
# reward 用的是 v1。如果汇报也用 v1，那么"语义指标提升 3.5 分"等价于
# "我们优化的那个函数涨了"—— 这是循环论证，答辩时一句话就会被问倒。
#
# v2 和 v1 的**故意差异**（不是抄一遍改个数）：
#   * 维度划分不同：v1 四维各 25 分，v2 三维（一致性/信息量/可用性）
#   * 提问方式不同：v2 先让裁判列出"候选相比参考少了什么、多了什么"，
#     再打分 —— 强迫它逐条核对，而不是凭整体印象给分
#   * 锚点措辞不同，且 v2 明确要求对"编造数字"零容忍
#
# 两个 judge 结论方向一致（都涨/都跌），才能说"语义真的变好了"。
# 只有一个涨，说明那个涨是 rubric 的偏好，不是摘要的进步。

version: v2
scale: 100

template_with_source: |
  你是资深法官，负责抽查一份自动生成的裁判文书摘要能否直接使用。

  【判决书原文】
  {source}

  【人工撰写的参考摘要】
  {reference}

  【待评摘要】
  {candidate}

  第一步，逐项列出（不要跳过）：
    A. 待评摘要**漏掉**了参考摘要里的哪些要素（逐条列）
    B. 待评摘要**多写**了参考摘要里没有的内容（逐条列；若这些内容能在
       原文里找到，注明；找不到就是编造）
    C. 待评摘要与参考摘要在**判决结果**上是否一致（一致 / 不一致 / 参考未涉及）

  第二步，按三个维度打分（合计 0-100）：

    维度一 事实一致性（0-40）
      40：A 空、B 里没有编造内容、C 一致
      25：有 1 处轻微出入（用词模糊，但不改变事实）
      10：有 1 处事实错误，或 B 里有 1 处编造
      0 ：判决结果与参考相反，或有 2 处以上编造

    维度二 信息量（0-40）
      40：A 为空（参考的要素一个没漏）
      28：漏 1 项次要要素
      15：漏 1 项关键要素（诉求 / 争议焦点 / 判决结果 之一）
      0 ：漏 2 项以上关键要素

    维度三 可用性（0-20）
      20：可直接作为摘要使用，篇幅与参考相当（0.8~1.2 倍），无口语化表达
      12：需小幅修改（个别病句、长度偏 30% 以内）
      5 ：需要重写（表达混乱，或长度明显失衡）
      0 ：不是摘要（对话式输出、抄录原文、只有一句话）

  最后一行必须是：总分：<0-100 的整数>

# 没有原文时用这个（无法判断编造，所以维度一降低到 30 分，维度二升到 45）
template: |
  你是资深法官，负责抽查一份自动生成的裁判文书摘要。

  【人工撰写的参考摘要】
  {reference}

  【待评摘要】
  {candidate}

  先逐条列出：待评摘要漏掉了参考摘要的哪些要素、多写了哪些内容、
  判决结果是否与参考一致。

  再按三个维度打分（合计 0-100）：
    事实一致性（0-30）：数字、日期、当事人、判决结果与参考是否一致，
        结论相反直接 0 分。
    信息量（0-45）：参考的关键要素覆盖了多少。
    可用性（0-25）：篇幅是否与参考相当，表达是否规范。

  最后一行必须是：总分：<0-100 的整数>
