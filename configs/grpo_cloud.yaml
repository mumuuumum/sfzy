defaults: sft_cloud

# 2× RTX 4090 上的 GRPO 配置。
#
# 主方案：门控 + 事实覆盖 + ROUGE。
# 对照组见文件末尾的注释 —— A1/A3 靠改 reward.mode 和 weights 实现。

model_config: configs/model_chatglm3_6b_bf16.yaml
data_config: configs/data_splits.yaml

rl:
  output_dir: outputs/grpo_chatglm3
  prompt_style: structured
  # 用 tools/select_rl_prompts.py 筛出来的 prompt 池
  prompt_file: data/splits/rl_prompts.jsonl

  # ---- rollout ----
  group_size: 8                 # 主流取值；大了一倍成本，小了优势估计不稳
  # **显存 = prompts_per_step × group_size × 序列长度**，一次 forward 全塞进去。
  # 4×8=32 条 × 2432 token = 7.8 万 token，6B 模型上必然 OOM。
  # 所以从 1 起步（8 条 ≈ 1.95 万 token），量完显存再往上加：
  #     python scripts/check_memory.py --batch-size 8 --seq-len 2432
  # 加不加都不影响总生成量（rollout 才是瓶颈），只影响每个优化步的梯度质量。
  prompts_per_step: 1
  max_new_tokens: 384           # 参考摘要中位数 293 字，留点余量
  max_length: 2048
  temperature: 0.9              # 要有方差才能算出 advantage
  top_p: 0.95

  # ---- 算法 ----
  clip_ratio: 0.2
  # KL 系数是要**做对照**的一项，不是照抄默认值：
  #   SFT 本身就有漏事实的习惯，而 KL 惩罚会把策略往 SFT 拉 ——
  #   等于保护了要改进的错误行为。所以三档都跑一遍：
  #   0.0（不约束） / 0.01 / 0.05
  kl_coef: 0.0
  length_norm: sqrt             # 输出长度差 13 倍，必须归一化
  learning_rate: 1.0e-5
  max_grad_norm: 1.0
  grad_accum_steps: 1

  # ---- 存档与日志 ----
  save_every_n_steps: 50
  keep_last_n_checkpoints: 2
  log_every_n_steps: 1
  resume_from: null

  # ---- 奖励 ----
  # 四层结构（门控 / 事实 F1 / 裁判语义分 / ROUGE）的默认值在 rl/reward.py 里，
  # 这里只覆盖要动的那几项。
  reward:
    # rouge_only | flat | gated | gated_judge
    mode: gated_judge
    # 事实项用对称 F1（漏写扣分、参考没写时多写也扣分），
    # 旧口径 coverage 只保留作报告字段。理由见 rl/reward.py 的 docstring。
    fact_term: f1
    weights:
      rouge_l: 0.3             # 官方口径的锚，权重压低但不为 0
      fact: 0.4                # ★ 可验证、不可骗
      semantic: 0.3            # 生成式裁判，补 ROUGE 和事实项都覆盖不到的语义
      length: 0.1              # 只在 flat 模式下生效

  # ---- SFT 基线锚（可选）----
  # 组内所有采样都不如 SFT 输出时，丢掉这一组不产生梯度。
  # **默认关**：它需要 prompt 池里带 sft_output（见 tools/select_rl_prompts.py
  # --triples），没带就自动跳过。先跑无锚的版本，把锚当作第二个实验变量。
  anchor:
    enabled: false
    slack: 0.05                # 容差：比 SFT 差 5 分以内仍算这一组排序有意义

# ==================== 语义裁判 ====================
# 和 rl.reward.mode 配套：只有 gated_judge 或显式 --judge-backend 才会加载。
# 裁判模型放在**卡 1**（策略吃满卡 0）。用 API 后端则不占显存。
semantic:
  # local —— 点式打分（每条候选独立给 0-100）。试了三版都不行，见
  #          configs/judge_rank_rubric.yaml 顶部的事故记录。
  # rank  —— 组内排序（G 条候选一起给裁判排序）。**当前推荐**：
  #          没有"拆要素"这个可走捷径的中间环节，且和 GRPO 只需要相对分数
  #          天然对齐，成本还低 8 倍（1 次调用/组）。
  # api / cache / none 见 docs/semantic_metrics.md
  backend: local               # local | rank | api | cache | none
  model: /root/autodl-tmp/models/Qwen2.5-7B-Instruct
  rubric_file: configs/judge_rubric_v1.yaml   # 进奖励的 rubric
  device: cuda:1
  dtype: bfloat16
  load_in_4bit: false          # 4090 上 7B 用 bf16 够（约 15G）
  samples: 1                   # 1 条就够；要测裁判自噪声时才调大
  temperature: 0.7
  max_new_tokens: 512          # 逐维度写理由，给小了会被截断（截断样本按失败丢弃）

  # ---- backend=rank 时用 ----
  # repeat 是"换几个随机顺序各排一次取平均"，用来消位置偏置。
  # 1 次太受顺序影响，3 次以上边际收益很小且线性涨价。
  repeat: 2
  # group_size 不用写：train_grpo.py 会自动对齐到 rl.group_size，
  # 不一致会导致不同 prompt 的候选被排到一起（不报错，只是全错）。

  # ---- backend=api 时用 ----
  base_url: https://api.deepseek.com/v1
  api_model: deepseek-chat
  api_key_env: JUDGE_API_KEY   # key 放环境变量，别写进 yaml（会跟着 git 走）
  max_workers: 8

  # ---- backend=cache 时用（离线评测）----
  cache_files: []

# ==================== 四组对照实验怎么配 ====================
#
# A1  纯 ROUGE 基线（回答"不设计奖励、只优化官方指标能到哪"）
#     --override rl.reward.mode=rouge_only
#
# A2  可补偿的加权求和（对照组：证明"门控"这个设计本身有用）
#     reward.mode: flat
#     --override rl.reward.mode=flat
#
# A3  门控 + 事实 F1 + ROUGE（不含裁判）
#     --override rl.reward.mode=gated --judge-backend none
#
# A4  主方案：加上生成式语义裁判
#     就是本文件的默认值
#
# 判据见 docs/semantic_metrics.md 第 4 节。A3 → A4 的差值是"语义指标这一项
# 值不值一个 7B 裁判的显存和每步多出的十几秒"。
