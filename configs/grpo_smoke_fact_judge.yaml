# ============================================================================
# 小规模冒烟：**只验证接线通不通、会不会 OOM**，不看效果。
#
# 适用场景：单卡显存 14~16GB，正常规模会在策略前向的 logits 上 OOM ——
#
#     logits 大小 ≈ N × L × vocab × 2 字节
#     默认：8 × 2432 × 65024 × 2 ≈ 2.5GB（还要再算 logsumexp 的中间量）
#     冒烟：2 × 1216 × 65024 × 2 ≈ 0.32GB
#
# 三个杠杆按"效果/代价"排序：
#   group_size      8 → 2     峰值按 N 线性下降；代价是组内基线更抖
#   max_length      2048 → 1024   激活与 logits 同时下降
#   max_new_tokens  384 → 192     别让输出短到被门控全拦下
#
# 这份配置**自包含**，不继承任何其它 yaml。
#
# 用法：
#   python scripts/train_grpo.py --config configs/grpo_smoke_fact_judge.yaml \
#       --override rl.limit_prompts=4
#
# 看什么（附判据）：
#   * 启动几行：策略精度 4-bit nf4 / 语义裁判 judge_fact / 实际生效的配置
#   * reward 组内 σ 不为 0                          ← 奖励有区分度
#   * 事实一致性那一行的档位分布不是 100% 落在 4     ← 裁判在真的判
#   * judge_missing 接近 0                          ← 裁判没在批量失败
#   * nvidia-smi 里卡 0 峰值离 14.5G 还留 1G 以上    ← 之后才敢放大
# ============================================================================

seed: 42
device: auto

data_config: configs/data_splits.yaml

model:
  model_name_or_path: /root/autodl-tmp/chatglm3-6b   # 换成你机器上的路径
  trust_remote_code: true
  load_in_4bit: true
  bnb_4bit_quant_type: nf4
  bnb_4bit_use_double_quant: true
  bnb_4bit_compute_dtype: bfloat16
  torch_dtype: bfloat16
  device_map: {"": 0}
  max_length: 4096

lora:
  r: 16
  alpha: 32
  dropout: 0.0
  target_modules: ["query_key_value", "dense", "dense_h_to_4h", "dense_4h_to_h"]

rl:
  output_dir: outputs/grpo_smoke
  prompt_style: structured
  prompt_file: data/splits/rl_prompts.jsonl
  sft_adapter: outputs/sft_chatglm3/step_000336.pt   # 换成你机器上的路径
  limit_prompts: 4            # 4 条 prompt 就能看到 4 个优化步

  quantize: true

  group_size: 4
  prompts_per_step: 1
  max_length: 8192
  max_new_tokens: 512
  temperature: 0.9
  top_p: 0.95

  gradient_checkpointing: true
  logprob_micro_batch: 1      # 最省显存：把序列分开算，数值不变

  clip_ratio: 0.2
  kl_coef: 0.0
  length_norm: sqrt
  learning_rate: 1.0e-5
  max_grad_norm: 1.0
  grad_accum_steps: 1

  save_every_n_steps: 5
  keep_last_n_checkpoints: 1
  log_every_n_steps: 1
  resume_from: null

  reward:
    normalize_weights: true
    terms:
      rouge_l: {enabled: true, weight: 0.3}
      fact_consistency:
        enabled: true
        weight: 0.7
  anchor:
    enabled: false
    slack: 0.05

semantic:
  backend: fact
  model: /root/autodl-tmp/models/Qwen2.5-7B-Instruct   # 换成你机器上的路径
  trust_remote_code: false
  device: cuda:1
  dtype: bfloat16
  load_in_4bit: true
  bnb_4bit_compute_dtype: bfloat16
  # 这两项只影响速度与裁判侧显存；冒烟时压小一点换速度
  max_batch_size: 4
  extract_max_new_tokens: 512
  min_document_elements: 2
  doc_fallback: true

tracking:
  backend: swanlab
  project: sfzy
