# ============================================================================
# GRPO 换 Qwen 底座的版本（策略也用 Qwen2.5-7B-Instruct）
#
# 和 grpo_fact_judge.yaml 的区别只有策略底座与 LoRA 目标层；
# 奖励、裁判、rollout 参数完全一致。这份配置**自包含**，不继承其它 yaml。
#
# 注意：LoRA 目标层必须和 SFT 阶段用的一致，否则载入 adapter 会 shape mismatch。
#
# 跑法：
#   python scripts/train_grpo.py --config configs/grpo_cloud_qwen.yaml
# ============================================================================

seed: 42
device: auto

data_config: configs/data_splits.yaml

model:
  model_name_or_path: Qwen/Qwen2.5-7B-Instruct   # 换成你机器上的路径更稳
  trust_remote_code: false
  load_in_4bit: true
  bnb_4bit_quant_type: nf4
  bnb_4bit_use_double_quant: true
  bnb_4bit_compute_dtype: float16
  torch_dtype: float16
  device_map: {"": 0}
  max_length: 4096

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: ["q_proj", "k_proj", "v_proj", "o_proj"]

rl:
  output_dir: outputs/grpo_qwen
  prompt_style: structured
  prompt_file: data/splits/rl_prompts.jsonl
  sft_adapter: outputs/sft_chatglm3/step_000336.pt   # 换成 Qwen 那次 SFT 的产物
  limit_prompts: null

  quantize: true

  group_size: 4
  prompts_per_step: 1
  max_length: 2048
  max_new_tokens: 384
  temperature: 0.9
  top_p: 0.95

  gradient_checkpointing: true
  logprob_micro_batch: 2

  clip_ratio: 0.2
  kl_coef: 0.0
  length_norm: sqrt
  learning_rate: 1.0e-5
  max_grad_norm: 1.0
  grad_accum_steps: 1

  save_every_n_steps: 25
  keep_last_n_checkpoints: 2
  log_every_n_steps: 1
  resume_from: null

  reward:
    normalize_weights: true
    terms:
      rouge_l: {enabled: true, weight: 0.3}
      fact_consistency:
        enabled: true
        weight: 0.7
        element_weights:
          case_type:          0.05
          plaintiff_claims:   0.15
          defendant_defenses: 0.10
          court_facts:        0.25
          legal_basis:        0.15
          judgment_result:    0.30

  anchor:
    enabled: false
    slack: 0.05

semantic:
  backend: fact
  model: /root/autodl-tmp/models/Qwen2.5-7B-Instruct   # 换成你机器上的路径
  trust_remote_code: false
  device: cuda:1
  dtype: bfloat16
  load_in_4bit: true
  bnb_4bit_compute_dtype: bfloat16
  max_batch_size: 8
  extract_max_new_tokens: 1024
  min_document_elements: 2
  doc_fallback: true

tracking:
  backend: swanlab
  project: sfzy
