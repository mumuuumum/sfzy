defaults: sft

# 2× RTX 4090 (24GB) 的 SFT 配置。
#
# 改动原则：**只动影响显存的项**，其余全部沿用 Kaggle 配置（T4 那一版），
# 这样两边跑出来的差异只来自硬件，不是来自超参。

model_config: configs/model_chatglm3_6b_bf16.yaml
data_config: configs/data_splits.yaml

sft:
  output_dir: outputs/sft_chatglm3
  num_epochs: 1                  # 按要求

  # ==================== 影响显存的四项 ====================
  # 1. 权重精度：4-bit → bf16，权重从 3.5GB 涨到 12GB
  #    （在 model_chatglm3_6b_bf16.yaml 里设）
  # 2. batch：2 → 4，24GB 的推荐起点，测完可以试 6
  per_device_batch_size: 4
  # 3. 序列长度：1536 → 2048。激活和 logits 都随它增长，
  #    是 OOM 风险最大的一项，真撑不住先降它
  max_length: 4096
  # 4. 梯度检查点：必须开。关掉的话激活会涨到几十 GB
  gradient_checkpointing: true

  dtype: bfloat16                # 4090 支持，scaler 自动关闭

  # ==================== 以下不影响显存，保持 Kaggle 的值 ====================
  grad_accum_steps: 4            # 等效 batch = 4 × 4 = 16
  learning_rate: 2.0e-4
  weight_decay: 0.0
  warmup_ratio: 0.03
  min_lr_ratio: 0.0
  max_grad_norm: 1.0
  num_workers: 4
  pin_memory: true
  save_every_n_steps: 200
  keep_last_n_checkpoints: 2
  log_every_n_steps: 20
  use_compile: false
  resume_from: null

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: ["query_key_value", "dense", "dense_h_to_4h", "dense_4h_to_h"]
