defaults: base

model_config: configs/model_chatglm3_6b.yaml
data_config: configs/data.yaml

# 摘要任务没有天然的人类偏好对，但奖励是"可验证"的：
# ROUGE 可算、法条引用可匹配、长度和格式可检查。
# 因此规则奖励配 GRPO 比 DPO 更贴合这个任务。
rl:
  method: grpo
  output_dir: outputs/grpo
  group_size: 8          # 每个 prompt 采样几条来估计组内基线
  num_epochs: 1
  per_device_batch_size: 1
  grad_accum_steps: 8
  learning_rate: 1.0e-5
  max_new_tokens: 256
  temperature: 0.9
  top_p: 0.95
  kl_coef: 0.01
  clip_ratio: 0.2
  fp16: true
  save_every_n_steps: 200
  log_every_n_steps: 10
  resume_from: null

  # ---- 规则奖励（rl/reward.py）----
  #
  # mode 是整个 RL 阶段的**单变量开关**：
  #
  #   rouge_only   总分 = ROUGE-L。不过门控、不看事实（A1 对照）
  #   flat         全部加权求和，可互相补偿（A2 对照）
  #   gated        硬门控 + 事实 F1 + ROUGE-L（A3）
  #   gated_judge  再加生成式语义裁判（A4，主方案，见 grpo_cloud.yaml）
  #
  # 四种模式共用同一套分项计算（见 compute_reward），所以对比只有一个变量。
  # 本地调试默认走 gated（不需要加载裁判模型）。切换方式：
  #     python scripts/train_grpo.py --config configs/grpo.yaml \
  #         --override rl.reward.mode=flat
  #
  # 奖励的痛点来自对旧输出的实测：漏掉的数字里 98.5% 就写在原文里
  # （是漏抄不是幻觉），漏事实的样本平均分比干净样本低 0.073，
  # 而 ROUGE 对"漏一个金额"几乎不敏感 —— 所以主信号必须是事实项。
  reward:
    mode: gated
    fact_term: f1         # 对称 F1；旧口径 coverage 只用于报告字段
    weights:
      rouge_l: 0.3          # 和官方评测口径对齐
      fact: 0.4             # ★ 主信号：参考摘要里的关键事实覆盖了多少
      semantic: 0.3         # 只在 gated_judge 模式下参与
      length: 0.1           # 只在 flat 模式下参与
    fact_kinds: ["money", "date", "id"]
    rouge_mode: jieba       # 中文必须分词后再算（见 eval/rouge.py）
    gate:
      min_chars: 60
      length_ratio_range: [0.5, 1.5]   # 相对参考摘要的长度区间
      forbidden_prefixes: ["以下是", "摘要：", "摘要:", "本摘要", "这是"]
      require_result_marker: true      # 必须出现"判决如下/判令/驳回"等

  # SFT 基线锚：组内最好的都不如 SFT 输出时丢掉这一组。
  # 需要 prompt 池带 sft_output，见 tools/select_rl_prompts.py --triples
  anchor:
    enabled: false
    slack: 0.05

# 本地调试不加载裁判（CPU 上跑 7B 不现实）。Kaggle/AutoDL 的配置见 grpo_cloud.yaml。
semantic:
  backend: none
