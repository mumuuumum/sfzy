defaults: base

model_config: configs/model_chatglm3_6b.yaml
data_config: configs/data.yaml

# 2025-03 的 DPO 效果不理想，这一版的目标是搞清楚原因，而不是简单重跑。
# 需要重点记录的对比维度：
#   1. 偏好对的来源（模型自造 / ROUGE 排序 / 人工）对结果的影响
#   2. beta 取值
#   3. 参考模型与策略模型的分布差距
#   4. 输出长度是否出现系统性坍缩（DPO 的典型失败模式）
rl:
  method: dpo
  output_dir: outputs/dpo
  beta: 0.1
  num_epochs: 1
  per_device_batch_size: 1
  grad_accum_steps: 8
  learning_rate: 5.0e-6
  max_length: 2048
  max_prompt_length: 1536
  fp16: true
  save_every_n_steps: 200
  log_every_n_steps: 10
  resume_from: null
