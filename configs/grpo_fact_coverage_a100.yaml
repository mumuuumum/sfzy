# ============================================================================
# 事实一致性 + 关键要素覆盖率 —— 2× A100 40GB
#
# 奖励口径与 T4 版完全一致，只是规模/精度按 A100 放大。
# 这份配置**自包含**，不继承任何其它 yaml。
#
# 跑法：
#   python scripts/train_grpo.py --config configs/grpo_fact_coverage_a100.yaml
# ============================================================================

seed: 42
device: auto

data_config: configs/data_splits.yaml

model:
  model_name_or_path: /root/autodl-tmp/chatglm3-6b   # 换成你机器上的路径
  trust_remote_code: true
  load_in_4bit: true
  bnb_4bit_quant_type: nf4
  bnb_4bit_use_double_quant: true
  bnb_4bit_compute_dtype: bfloat16
  torch_dtype: bfloat16
  device_map: {"": 0}
  max_length: 4096

lora:
  r: 16
  alpha: 32
  dropout: 0.0
  target_modules: ["query_key_value", "dense", "dense_h_to_4h", "dense_4h_to_h"]

rl:
  output_dir: outputs/grpo_fact_coverage_a100
  prompt_style: structured
  prompt_file: data/splits/rl_prompts.jsonl
  sft_adapter: outputs/sft_chatglm3/step_000336.pt   # 换成你机器上的路径
  limit_prompts: null

  quantize: true

  group_size: 8
  prompts_per_step: 1
  max_length: 3072
  max_new_tokens: 512
  temperature: 0.9
  top_p: 0.95

  gradient_checkpointing: true
  logprob_micro_batch: 4

  clip_ratio: 0.2
  kl_coef: 0.0
  length_norm: sqrt
  learning_rate: 1.0e-5
  max_grad_norm: 1.0
  grad_accum_steps: 1

  save_every_n_steps: 25
  keep_last_n_checkpoints: 2
  log_every_n_steps: 1
  resume_from: null

  # ---- 奖励：两个 judge 项，各有各的内部权重 ----
  reward:
    normalize_weights: true
    terms:
      rouge_l: {enabled: false, weight: 0.0}
      fact_consistency:
        enabled: true
        weight: 0.7
        element_weights:
          case_type:          0.05
          plaintiff_claims:   0.15
          defendant_defenses: 0.10
          court_facts:        0.25
          legal_basis:        0.15
          judgment_result:    0.30
      element_coverage:
        enabled: true
        weight: 0.3
        element_weights:
          case_type:          0.05
          plaintiff_claims:   0.15
          defendant_defenses: 0.10
          court_facts:        0.25
          legal_basis:        0.15
          judgment_result:    0.30

  anchor:
    enabled: false
    slack: 0.05

semantic:
  backend: fact
  model: /root/autodl-tmp/models/Qwen2.5-7B-Instruct   # 换成你机器上的路径
  trust_remote_code: false
  device: cuda:1
  dtype: bfloat16
  load_in_4bit: false
  max_batch_size: 8
  extract_max_new_tokens: 1024
  min_document_elements: 2
  doc_fallback: true

tracking:
  backend: swanlab
  project: sfzy
