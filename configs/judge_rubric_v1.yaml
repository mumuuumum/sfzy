# LLM 裁判的评分标准 v1.1（reward 用）
#
# ============================ 为什么单独放一个文件 ============================
# 因为**对外汇报的 judge 不能用这一版**。
# 训练用的 rubric（v1）是优化目标的一部分，拿它汇报"语义指标 +3 分"是循环论证。
# 汇报时换 rubric v2 或换一个模型（见 configs/judge_rubric_v2.yaml），
# 两个 judge 的结论方向一致，才能说"语义指标真的提升了"。
#
# 改这个文件时必须把 version 字段一起改 —— 训练日志里会记下版本号，
# 否则你半年后分不清哪次实验用的哪版标准。
#
# ============================ v1 → v1.1 修了什么 ============================
# v1 在 20 条冒烟上给出了 {100×16, 85×2, 75, 40} —— 16 条满分。翻 raw 输出发现
# 裁判把 rubric 里的**锚点描述原封不动抄进了"理由"栏**：
#
#     维度 3 取舍与篇幅：25 分。详略得当，长度与参考摘要相当（0.8~1.2 倍）……
#
# 而那条摘要的实际长度比是 1.73（rubric 明写 >1.5 该给 5 分）。
# 它没在评，它在背。三个根因，一起治：
#
#   1. **锚点可被背诵** → v1.1 不再让裁判"综合印象打分"，而是要求它先枚举
#      要素、再从候选里**原样抄出对应句**，分数由枚举结果**算**出来。
#      抄不出句子却给分＝无效判定。没找到的句子是编不出来的。
#   2. **可机械计算的项交给了 LLM** → 长度、金额、日期一律划归程序
#      （reward.py 已经算了），裁判只做程序做不到的**语义等价判断**。
#   3. **宽松偏差** → 分数从枚举结果推导，不给"整体印象"留口子。
#
# 上一版的问题不在"分数偏高"，而在**分数不携带信息**：组内 8 条全 100，
# GRPO 归一化后语义项被抹成常数，A4 会退化成 A3。区分度才是判据。

# v1.1 → v1.2 修了什么（18 条有效样本的实测）：
#
#   进步：满分从 16/20 降到 8/18，取值从 4 个散到 8 个；长度比 >1.5 的三条
#         全部掉出满分（1.80→83、1.60→33、1.73→33）。
#
#   缺陷一：**要素是从候选里挑的，不是从参考里拆的。**
#         裁判把"参考的要素"拆成了"候选里存在的内容"，于是必然全中。
#         f4752814 的 6 条要素里有 5 条直接来自候选，判 100；
#         而参考里的"原被告均系第一顺序继承人""二分之一份额四人平均继承"
#         两条关键法律推理，候选压根没写，也就没有被拆出来考。
#         → v1.2 要求：只从参考拆、每条附上参考里的原句片段、且明确
#           "拆的时候不要看候选"。
#
#   缺陷二：**伪造抄录。** 83 条抄录里 23 条（28%）在候选里找不到，
#         却能在参考里找到 —— 它一边说"抄的是候选"，一边抄的是参考，
#         然后据此给分。这种错误不报错、分数看着正常。
#         → v1.2 要求抄录**不超过 15 字的连续片段**、必须逐字复制，
#           并写明"抄参考会判为无效"。同时 `metrics.verify_judge_output`
#           会**程序化验证**这两件事，把伪造率变成可量化的指标。
#
# （重复啰嗦没有被扣分的问题不用改 rubric：8da43367 重复 20 遍、长度比 1.80，
#   已经撞在奖励的**长度门控**上直接 0 分。分层奖励里门控就该管这类事。）

version: v1.2
scale: 100

# 有原文时用这个（能查编造：候选里的事实是不是真出自判决书）
template_with_source: |
  你是法官助理，负责核对一份自动生成的裁判文书摘要。你**只做语义层面的核对**。

  【判决书原文（节选）】
  {source}

  【参考摘要（人工撰写，金标准）】
  {reference}

  【待评摘要】
  {candidate}

  注意：篇幅是否合适、金额和日期有没有抄错，由程序另行核对，**这两项你不要评**。
  你只做三件事：拆要素、逐条比对、判编造。

  ── 第一步：拆要素 ──
  **只看【参考摘要】拆要素，拆的时候不要看待评摘要** —— 否则你会不知不觉
  专挑候选里写过的东西当要素，那就失去了比对的意义。

  把参考摘要拆成**不超过 6 条**非数字的关键信息点，逐条编号，并在括号里
  **附上该要素在参考摘要里的原句片段（不超过 15 字）**。不要写金额和日期。
  格式：
    1. 双方存在租赁合同关系（"原被告签订的租赁合同"）
    2. 被告未按期支付租金（"未向原告履行支付租金的义务"）
    3. 法院驳回违约金请求（"驳回原告的违约金请求"）

  ── 第二步：逐条比对 ──
  对每条要素，从【待评摘要】里**逐字复制**表达同一意思的片段；抄不出就写"无"。
  三条硬性要求：
    * 抄录**不超过 15 字**，必须是候选里的**连续片段**，一个字都不要改
    * **不要抄参考摘要里的句子** —— 那是参考的，不是候选的
    * 找不到对应片段就必须写"无"并给 0 分，**编造抄录会让这次评分作废**
  然后给判定分：
    2 = 完全一致（意思相同，换词不算错）
    1 = 沾边但不完整，或表述含糊
    0 = 待评摘要里没有这个意思
  格式：
    要素1 [2分] 抄录："原被告系租赁合同关系"
    要素2 [1分] 抄录："被告应支付租金"（未按期这一点没写）
    要素3 [0分] 抄录：无

  ── 第三步：找编造 ──
  列出待评摘要里在【判决书原文】中**查不到**的事实（注意是"原文里没有"，
  不是"参考里没有"）。逐条编号；没有就写"无"。

  ── 第四步：算分 ──
  要素覆盖分 = (第二步判定分的总和) ÷ (2 × 要素条数) × 100   （取整数）
  总分 = 要素覆盖分 − 25 × 编造条数，最低 0

  **直接给出第四步算出来的数字，不要凭整体印象调整。**
  最后一行必须是：总分：<0-100 的整数>

# 没有原文时用这个（判不了编造，只看要素覆盖；比带原文的版本快不少）
template: |
  你是法官助理，负责核对一份自动生成的裁判文书摘要。你**只做语义层面的核对**。

  【参考摘要（人工撰写，金标准）】
  {reference}

  【待评摘要】
  {candidate}

  注意：篇幅、金额、日期由程序另行核对，你不要评。

  第一步：**只看参考摘要**拆要素（不要看候选，否则会专挑候选写过的东西），
          不超过 6 条非数字信息点，逐条编号，每条附上参考里的原句片段（≤15 字）。
  第二步：对每条要素，从【待评摘要】里**逐字复制**不超过 15 字的连续片段；
          抄不出就写"无"并给 0 分。**不要抄参考摘要里的句子，编造抄录会让
          这次评分作废。** 判定分：2=完全一致，1=沾边但不完整，0=没有。
  第三步：算分。要素覆盖分 = (判定分总和) ÷ (2 × 要素条数) × 100（取整数）。

  示例：
    【参考】双方存在租赁合同关系；被告未按期支付租金；法院驳回违约金请求。
    【待评】原被告系租赁合同关系，被告应支付租金。
    1. 双方存在租赁合同关系（"原被告签订租赁合同"）
    2. 被告未按期支付租金（"未支付租金"）
    3. 法院驳回违约金请求（"驳回违约金请求"）
    要素1 [2分] 抄录："原被告系租赁合同关系"
    要素2 [1分] 抄录："被告应支付租金"（未按期这一点没写）
    要素3 [0分] 抄录：无
    要素覆盖分 = (2+1+0) ÷ (2×3) × 100 = 50
    总分：50

  最后一行必须是：总分：<0-100 的整数>
