# LLM 裁判的评分标准 v1（reward 用）
#
# ============================ 为什么单独放一个文件 ============================
# 因为**对外汇报的 judge 不能用这一版**。
# 训练用的 rubric（v1）是优化目标的一部分，拿它汇报"语义指标 +3 分"是循环论证。
# 汇报时换 rubric v2 或换一个模型（见 configs/judge_rubric_v2.yaml），
# 两个 judge 的结论方向一致，才能说"语义指标真的提升了"。
#
# 改这个文件时必须把 version 字段一起改 —— 训练日志里会记下版本号，
# 否则你半年后分不清哪次实验用的哪版标准。

version: v1
scale: 100          # 总分上限。裁判直接输出 0-100，四维各占 25

# 有原文时用这个（能查幻觉：候选里的事实是不是真出自判决书）
template_with_source: |
  你是一名中国法官助理，正在审核一份民事判决书的自动摘要。

  【判决书原文（节选）】
  {source}

  【参考摘要（人工撰写，视为金标准）】
  {reference}

  【待评摘要】
  {candidate}

  请按下面四个维度逐项打分，每项 0-25 分，最后求和得到 0-100 的总分。

  维度 1 事实准确性（0-25）
    25 分：金额、日期、当事人、合同关系、判决结果全部与原文一致，无编造。
    15 分：事实都对，但有一处表述含糊（如"支付相应款项"未说金额）。
    5  分：有一处具体事实与原文不符（金额写错、当事人张冠李戴）。
    0  分：出现原文中不存在的事实（编造了金额、条款、判决项）。
    注意：**判决结果写反（驳回写成支持）本项直接 0 分**，这是最严重的错误。

  维度 2 要素完整性（0-25）
    25 分：参考摘要里的关键要素（诉求、争议焦点、查明事实、判决结果）全部覆盖。
    15 分：漏掉 1 个关键要素。
    5  分：漏掉 2-3 个关键要素。
    0  分：只剩结论，过程要素基本没写。

  维度 3 取舍与篇幅（0-25）
    25 分：详略得当，长度与参考摘要相当（0.8~1.2 倍），无关的程序性内容已剔除。
    15 分：篇幅偏差在 0.6~1.5 倍之间，或保留了明显的无关内容。
    5  分：明显过长（堆砌原文）或明显过短（信息不足）。
    0  分：抄写原文大段内容，或只有一句话。

  维度 4 法律表述规范（0-25）
    25 分：法言法语准确，"本院认为""判决如下"等表述规范，无口语化表达。
    15 分：有个别不规范表述，不影响理解。
    5  分：多处口语化或漏用法律术语，读起来不像裁判文书摘要。
    0  分：出现"以下是摘要""希望对你有所帮助"这类对话式输出。

  输出格式（必须遵守）：
    先逐项写简短理由（每项一行），再单独一行给出总分。
    最后一行必须是：总分：<0-100 的整数>

# 没有原文时用这个（只用参考摘要当金标准，速度快一倍）
template: |
  你是一名中国法官助理，正在审核一份民事判决书的自动摘要。

  【参考摘要（人工撰写，视为金标准）】
  {reference}

  【待评摘要】
  {candidate}

  请按四个维度逐项打分（各 0-25 分），最后求和得到 0-100 总分：
    1. 事实一致性：金额、日期、当事人、合同关系、判决结果与参考摘要是否一致；
       判决结论与参考相反则本项 0 分。
    2. 要素完整性：参考摘要的关键要素覆盖了多少。
    3. 取舍与篇幅：长度是否与参考相当（0.8~1.2 倍），是否混入无关内容。
    4. 法律表述规范：是否使用规范的法言法语，有无对话式废话。

  先逐项写一行理由，最后一行必须是：总分：<0-100 的整数>
