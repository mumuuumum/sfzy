# LLM 裁判的评分标准 v1.1（reward 用）
#
# ============================ 为什么单独放一个文件 ============================
# 因为**对外汇报的 judge 不能用这一版**。
# 训练用的 rubric（v1）是优化目标的一部分，拿它汇报"语义指标 +3 分"是循环论证。
# 汇报时换 rubric v2 或换一个模型（见 configs/judge_rubric_v2.yaml），
# 两个 judge 的结论方向一致，才能说"语义指标真的提升了"。
#
# 改这个文件时必须把 version 字段一起改 —— 训练日志里会记下版本号，
# 否则你半年后分不清哪次实验用的哪版标准。
#
# ============================ v1 → v1.1 修了什么 ============================
# v1 在 20 条冒烟上给出了 {100×16, 85×2, 75, 40} —— 16 条满分。翻 raw 输出发现
# 裁判把 rubric 里的**锚点描述原封不动抄进了"理由"栏**：
#
#     维度 3 取舍与篇幅：25 分。详略得当，长度与参考摘要相当（0.8~1.2 倍）……
#
# 而那条摘要的实际长度比是 1.73（rubric 明写 >1.5 该给 5 分）。
# 它没在评，它在背。三个根因，一起治：
#
#   1. **锚点可被背诵** → v1.1 不再让裁判"综合印象打分"，而是要求它先枚举
#      要素、再从候选里**原样抄出对应句**，分数由枚举结果**算**出来。
#      抄不出句子却给分＝无效判定。没找到的句子是编不出来的。
#   2. **可机械计算的项交给了 LLM** → 长度、金额、日期一律划归程序
#      （reward.py 已经算了），裁判只做程序做不到的**语义等价判断**。
#   3. **宽松偏差** → 分数从枚举结果推导，不给"整体印象"留口子。
#
# 上一版的问题不在"分数偏高"，而在**分数不携带信息**：组内 8 条全 100，
# GRPO 归一化后语义项被抹成常数，A4 会退化成 A3。区分度才是判据。

version: v1.1
scale: 100

# 有原文时用这个（能查编造：候选里的事实是不是真出自判决书）
template_with_source: |
  你是法官助理，负责核对一份自动生成的裁判文书摘要。你**只做语义层面的核对**。

  【判决书原文（节选）】
  {source}

  【参考摘要（人工撰写，金标准）】
  {reference}

  【待评摘要】
  {candidate}

  注意：篇幅是否合适、金额和日期有没有抄错，由程序另行核对，**这两项你不要评**。
  你只做三件事：拆要素、逐条比对、判编造。

  ── 第一步：拆要素 ──
  把参考摘要拆成**不超过 6 条**非数字的关键信息点，逐条编号写出。
  不要写金额和日期（那些交给程序）。例如：
    1. 双方存在租赁合同关系
    2. 被告未按期支付租金
    3. 法院驳回原告的违约金请求

  ── 第二步：逐条比对 ──
  对每条要素，从【待评摘要】里**原样抄出**表达同一意思的句子；抄不出就写"无"。
  然后给判定分：
    2 = 完全一致（意思相同，换词不算错）
    1 = 沾边但不完整，或表述含糊
    0 = 待评摘要里没有这个意思
  **抄不出句子却给 1 或 2 分，视为无效判定。**
  格式：
    要素1 [2分] 抄录："原被告系租赁合同关系"
    要素2 [1分] 抄录："被告应支付租金"（未按期这一点没写）
    要素3 [0分] 抄录：无

  ── 第三步：找编造 ──
  列出待评摘要里在【判决书原文】中**查不到**的事实（注意是"原文里没有"，
  不是"参考里没有"）。逐条编号；没有就写"无"。

  ── 第四步：算分 ──
  要素覆盖分 = (第二步判定分的总和) ÷ (2 × 要素条数) × 100   （取整数）
  总分 = 要素覆盖分 − 25 × 编造条数，最低 0

  **直接给出第四步算出来的数字，不要凭整体印象调整。**
  最后一行必须是：总分：<0-100 的整数>

# 没有原文时用这个（判不了编造，只看要素覆盖；比带原文的版本快不少）
template: |
  你是法官助理，负责核对一份自动生成的裁判文书摘要。你**只做语义层面的核对**。

  【参考摘要（人工撰写，金标准）】
  {reference}

  【待评摘要】
  {candidate}

  注意：篇幅、金额、日期由程序另行核对，你不要评。

  第一步：把参考摘要拆成不超过 6 条非数字的关键信息点，逐条编号。
  第二步：对每条要素，从【待评摘要】里**原样抄出**表达同一意思的句子；
          抄不出就写"无"。然后给判定分：2=完全一致，1=沾边但不完整，0=没有。
          （抄不出句子却给 1 或 2 分，视为无效判定。不要写金额和日期。）
  第三步：算分。要素覆盖分 = (判定分总和) ÷ (2 × 要素条数) × 100（取整数）。

  示例：
    【参考】双方存在租赁合同关系；被告未按期支付租金；法院驳回违约金请求。
    【待评】原被告系租赁合同关系，被告应支付租金。
    要素1 [2分] 抄录："原被告系租赁合同关系"
    要素2 [1分] 抄录："被告应支付租金"（未按期这一点没写）
    要素3 [0分] 抄录：无
    要素覆盖分 = (2+1+0) ÷ (2×3) × 100 = 50
    总分：50

  最后一行必须是：总分：<0-100 的整数>
