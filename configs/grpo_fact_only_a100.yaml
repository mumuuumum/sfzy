# ============================================================================
# 只考虑"事实一致性 reward" —— 2× A100 40GB 正式版
#
#   GPU0  策略：ChatGLM3-6B 4-bit NF4（冻结）+ LoRA + 优化器 + rollout
#   GPU1  裁判：Qwen2.5-7B-Instruct（bf16 全精度，冻结）
#
# 这份配置**自包含**：不继承任何其它 yaml。奖励口径与 T4 版一致（只留
# fact_consistency），差别只有规模与精度：40GB 装得下全精度裁判、组开大一倍。
#
# 跑法：
#   python scripts/train_grpo.py --config configs/grpo_fact_only_a100.yaml
# ============================================================================

seed: 42
device: auto

data_config: configs/data_splits.yaml     # 只有数据工具会用；GRPO 本身不读

# ---- 策略底座：A100 支持 bf16，用 4-bit + bf16 计算 ----
model:
  model_name_or_path: /root/autodl-tmp/chatglm3-6b   # 换成你机器上的路径
  trust_remote_code: true
  load_in_4bit: true
  bnb_4bit_quant_type: nf4
  bnb_4bit_use_double_quant: true
  bnb_4bit_compute_dtype: bfloat16
  torch_dtype: bfloat16
  device_map: {"": 0}                     # 策略钉卡 0，卡 1 留给裁判
  max_length: 4096

# ---- LoRA：必须和 SFT 阶段完全一致 ----
lora:
  r: 16
  alpha: 32
  dropout: 0.0
  target_modules: ["query_key_value", "dense", "dense_h_to_4h", "dense_4h_to_h"]

rl:
  output_dir: outputs/grpo_fact_only_a100
  prompt_style: structured
  prompt_file: data/splits/rl_prompts.jsonl
  sft_adapter: outputs/sft_chatglm3/step_000336.pt   # 换成你机器上的路径
  limit_prompts: null

  quantize: true

  # ---- rollout：40GB 卡的推荐取值 ----
  group_size: 8                 # 组内基线更稳；成本随时间线性涨
  prompts_per_step: 1
  max_length: 3072
  max_new_tokens: 512
  temperature: 0.9
  top_p: 0.95

  # ---- 显存 ----
  gradient_checkpointing: true
  logprob_micro_batch: 4

  # ---- 算法 ----
  clip_ratio: 0.2
  kl_coef: 0.0
  length_norm: sqrt
  learning_rate: 1.0e-5
  max_grad_norm: 1.0
  grad_accum_steps: 1

  # ---- 存档与日志 ----
  save_every_n_steps: 25
  keep_last_n_checkpoints: 2
  log_every_n_steps: 1
  resume_from: null

  # ---- 奖励：只留事实一致性 ----
  reward:
    normalize_weights: true
    terms:
      rouge_l: {enabled: false, weight: 0.0}
      fact_consistency:
        enabled: true
        weight: 1.0
  anchor:
    enabled: false
    slack: 0.05

  # ---- SwanLab 监控（见 docs/grpo_monitoring.md）----
  monitor:
    log_interval: 1
    reward_log_interval: 10
    relation_log_interval: 20
    entropy_log_interval: 20
    lora_update_log_interval: 20
    correlation_window: 512
    near_zero_std_eps: 1.0e-6
    near_upper_gate_margin: 0.1
    ee_low_threshold: 0.5
    ee_high_threshold: 0.75
    repetition_ngram: 3
    relation_enabled: true
    eval:
      enabled: false
      data_file: null
      every_n_steps: 100
      max_samples: 100
      max_new_tokens: 384
      max_length: 2048
      baseline: {}

# ---- 裁判（模型 B）：卡 1，40GB 装得下 7B 全精度 ----
semantic:
  backend: fact
  model: /root/autodl-tmp/models/Qwen2.5-7B-Instruct   # 换成你机器上的路径
  trust_remote_code: false
  device: cuda:1
  dtype: bfloat16
  load_in_4bit: false
  max_batch_size: 8
  extract_max_new_tokens: 1024
  min_document_elements: 2
  doc_fallback: true

tracking:
  backend: swanlab
  project: sfzy
