# ============================================================================
# GRPO：事实一致性 + ROUGE —— 通用版（2× 24GB，例如 4090）
#
#   GPU0  策略：ChatGLM3-6B 4-bit NF4（冻结）+ LoRA + 优化器 + rollout
#   GPU1  裁判：Qwen2.5-7B-Instruct 4-bit NF4（冻结，只做 inference）
#
# 这份配置**自包含**：不继承任何其它 yaml。T4 / A100 的版本见
# configs/grpo_fact_only_*.yaml 与 configs/grpo_fact_coverage_*.yaml。
#
# 上线前先过裁判验收（判据不达标就只是噪声）：
#   python scripts/judge_probe.py --model <裁判模型> --device cuda:1 --load-in-4bit
#   python scripts/judge_test.py  --model <裁判模型> --device cuda:1 --load-in-4bit \
#       --cases data/judge/fact_cases.jsonl
#
# 跑法：
#   python scripts/train_grpo.py --config configs/grpo_fact_judge.yaml
# ============================================================================

seed: 42
device: auto

data_config: configs/data_splits.yaml

model:
  model_name_or_path: /root/autodl-tmp/chatglm3-6b   # 换成你机器上的路径
  trust_remote_code: true
  load_in_4bit: true
  bnb_4bit_quant_type: nf4
  bnb_4bit_use_double_quant: true
  bnb_4bit_compute_dtype: bfloat16
  torch_dtype: bfloat16
  device_map: {"": 0}
  max_length: 4096

lora:
  r: 16
  alpha: 32
  dropout: 0.0                # RL 必须关掉（见 grpo_fact_only_t4.yaml 的说明）
  target_modules: ["query_key_value", "dense", "dense_h_to_4h", "dense_4h_to_h"]

rl:
  output_dir: outputs/grpo_chatglm3
  prompt_style: structured
  prompt_file: data/splits/rl_prompts.jsonl
  sft_adapter: outputs/sft_chatglm3/step_000336.pt   # 换成你机器上的路径
  limit_prompts: null

  quantize: true

  group_size: 4
  prompts_per_step: 1
  max_length: 2048
  max_new_tokens: 384
  temperature: 0.9
  top_p: 0.95

  gradient_checkpointing: true
  logprob_micro_batch: 2

  clip_ratio: 0.2
  kl_coef: 0.0                # 要做对照：0.0 / 0.01 / 0.05 各跑一遍
  length_norm: sqrt
  learning_rate: 1.0e-5
  max_grad_norm: 1.0
  grad_accum_steps: 1

  save_every_n_steps: 25
  keep_last_n_checkpoints: 2
  log_every_n_steps: 1
  resume_from: null

  # ---- 奖励 ----
  reward:
    normalize_weights: true
    terms:
      rouge_l: {enabled: true, weight: 0.3}      # 官方评测口径的锚
      fact_consistency:
        enabled: true
        weight: 0.7
      # 关键要素覆盖率：要启用就把 enabled 改成 true，并把 weight 调好
      element_coverage:
        enabled: false
        weight: 0.3
        element_weights:
          case_type:          0.05
          plaintiff_claims:   0.15
          defendant_defenses: 0.10
          court_facts:        0.25
          legal_basis:        0.15
          judgment_result:    0.30

  anchor:
    enabled: false
    slack: 0.05

  # ---- SwanLab 监控（见 src/sfzy/rl/monitor.py）----
  # 全部指标只从训练已产生的数据派生，不额外调用裁判、不重新生成摘要。
  monitor:
    log_interval: 1                 # 基础训练指标：每个优化步
    reward_log_interval: 10         # Reward 分项 / 六要素 / Gate：每 10 步
    relation_log_interval: 20       # 相关性 / 分项消融：每 20 步
    entropy_log_interval: 20        # 策略熵（同一次前向，低频）
    lora_update_log_interval: 20    # LoRA 更新范数（低频）
    correlation_window: 512         # 跨步相关性窗口（样本数）
    near_zero_std_eps: 1.0e-6       # "近零方差组"阈值
    near_upper_gate_margin: 0.1     # 距长度比上界多近算"接近上界"
    ee_low_threshold: 0.5           # 表达效率低分阈值（∈[0,1]）
    ee_high_threshold: 0.75         # 表达效率高分阈值（∈[0,1]）
    repetition_ngram: 3             # 重复 n-gram 的 n
    relation_enabled: true
    # 固定验证集（可选）：项目没有内置验证流程时保持 enabled=false。
    eval:
      enabled: false
      data_file: null
      every_n_steps: 100
      max_samples: 100
      max_new_tokens: 384
      max_length: 2048
      baseline: {}

semantic:
  backend: fact
  model: /root/autodl-tmp/models/Qwen2.5-7B-Instruct   # 换成你机器上的路径
  trust_remote_code: false
  device: cuda:1
  dtype: bfloat16
  load_in_4bit: true
  bnb_4bit_compute_dtype: bfloat16
  max_batch_size: 8
  extract_max_new_tokens: 1024
  min_document_elements: 2
  doc_fallback: true

tracking:
  backend: swanlab
  project: sfzy
