# 组内排序裁判（RL 奖励专用）
#
# ============================ 为什么用排序而不是打分 ============================
# 点式打分（每条候选独立给 0-100）在这个任务上试了三版，都不行：
#
#   v1    裁判把 rubric 的锚点原文抄进"理由"栏，20 条里 16 条满分
#   v1.1  改成"枚举要素再打分"，要素却是从**候选**里挑的（必然全中）
#   v1.2  要求要素只从参考拆、附上出处，实测出处 97% 仍来自候选
#
# 根因是结构性的：模型同时看到参考和候选时，会以更短、更像摘要的那份（候选）
# 为锚点组织阅读，于是它算的是 precision（候选的内容有多少在参考里），
# 而我们要的是 recall（参考的内容有多少被写出来）。这个偏差在实测里表现为
# corr(裁判分, 长度比) = -0.35 —— 越短越占便宜。
#
# 排序任务没有"拆要素"这个可走捷径的中间环节，模型没有可反向锚定的对象。
# 而且 GRPO 只需要组内相对分数（A_i = (r_i - mean) / std），绝对标定本来
# 就会被归一化减掉 —— 排序正好是它需要的形态。
#
# ============================ 为什么要打乱顺序 ============================
# LLM 裁判有位置偏置：靠前的候选容易被排高。所以同一组会用**多个随机顺序**
# 各排一次，把名次平均（见 ListwiseRankScorer.repeat）。顺序固定的话，
# 这个偏置会变成系统性的奖励噪声，而它恰好和"谁先被采样到"相关 ——
# 等于给 rollout 的随机顺序付钱。

version: rank-v1
# 排序任务不用 0-100 分，用名次换算。scale 只用于和点式 scorer 保持接口一致。
scale: 100

template_with_source: |
  你是资深法官。下面有一份判决书、一份人工撰写的参考摘要，以及 {n} 份
  由模型生成的候选摘要（用字母标注）。

  【判决书原文】
  {source}

  【参考摘要（金标准）】
  {reference}

  {candidates}

  请按"**作为这份判决书的摘要，谁更接近参考摘要**"把它们**从好到差**排序。
  判断依据，按重要性从高到低：

    1. **判决结果**是否与参考一致（写成相反方向的直接排到最差）
    2. **参考摘要里的关键要素**覆盖了多少（诉求、争议焦点、查明事实、判决项）
       —— 注意是"参考里有的有没有被写出来"，不是"候选写的对不对"
    3. 有没有**编造**参考和原文里都没有的事实
    4. 表述是否规范（次要）

  注意：候选长短不同不代表好坏，**不要因为某条更长或更短就排前/排后**；
  以"参考里的内容被写出来多少"为准。

  输出格式（必须严格遵守）：
    先写一两句比较理由，然后**最后一行**只输出排好的字母，用空格分隔，
    从最好到最差，不要有其它字符。
    例如：C A F B D E G H

